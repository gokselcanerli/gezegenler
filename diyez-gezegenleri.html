<title>ME-005 — Gezegen Tespit Sistemi · Diyez Parametrik</title>
<style>
:root{--cyan:#16cfff;--green:#39c982;--active-stone:#ff9f1c;--active-soft:#ffd166}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dfe3e8;font-family:Arial,sans-serif}
.app{width:min(96vw,900px)} .stage{position:relative;width:100%;aspect-ratio:1;background:#fff;box-shadow:0 10px 30px #0003;overflow:hidden}
.base-svg{width:100%;height:100%;display:block;user-select:none;pointer-events:none}
.click{position:absolute;top:39%;height:14%;border:0;background:transparent;cursor:pointer;border-radius:16px}
.click:hover{outline:3px dashed #16a7ff88;background:#16a7ff0c} .click.active{outline:4px solid var(--cyan);background:#16a7ff13;box-shadow:0 0 22px #16cfff99}
.g{left:17%;width:15%} .d{left:32%;width:15%} .a{left:47%;width:14%} .e{left:59%;width:14%} .b{left:70%;width:14%}
.glow{position:absolute;top:13%;height:20%;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;transform:scale(.94);box-shadow:0 0 16px 6px var(--active-stone),inset 0 0 0 4px var(--active-soft)}
.glow.on{opacity:.9;transform:scale(1);animation:pulse 1.05s ease-in-out infinite alternate}
.n5{left:24.4%;width:5.6%} .n3{left:33.3%;width:5.6%} .n1{left:42.2%;width:5.6%} .n4{left:58.6%;width:5.6%} .n2{left:67.5%;width:5.6%}
.face-tag{position:absolute;top:33.2%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;pointer-events:none;transition:.3s;background:#bbb;color:#fff;opacity:.52}
.face-tag.active{background:var(--green);opacity:1;box-shadow:0 0 10px #39c982aa;transform:translateX(-50%) scale(1.08)}
.tag-e{left:15.0%} .tag-f{left:20.0%} .tag-b{left:50.5%} .tag-c{left:55.7%}
.awake-person{transition:filter .3s,opacity .3s} .wake-pop{animation:wakePop .55s ease both}
.status{margin-top:12px;min-height:58px;padding:12px 16px;border-radius:14px;background:#fff;box-shadow:0 4px 16px #0002;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.status span{color:#075f8e} .hint{font-weight:500;color:#555;font-size:.92em;margin-left:8px} .reset{border:0;padding:9px 14px;border-radius:10px;background:#222;color:#fff;cursor:pointer;font-weight:700}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.5)}}
@keyframes wakePop{0%,100%{filter:drop-shadow(0 0 5px #45dfff) brightness(1)}18%{filter:drop-shadow(-2px 0 7px #45dfff) brightness(1.08)}36%{filter:drop-shadow(2px 0 8px #45dfff) brightness(1.13)}54%{filter:drop-shadow(-1px 0 7px #45dfff) brightness(1.08)}72%{filter:drop-shadow(1px 0 6px #45dfff) brightness(1.04)}}
@media(max-width:600px){.status{font-size:14px}.face-tag{width:21px;height:21px;font-size:11px}}

<div class="glow n5" data-num="1"></div><div class="glow n3" data-num="3"></div><div class="glow n1" data-num="5"></div><div class="glow n4" data-num="2"></div><div class="glow n2" data-num="4"></div>
<div class="face-tag tag-b" data-note="B">B</div><div class="face-tag tag-c" data-note="C">C</div><div class="face-tag tag-e" data-note="E">E</div><div class="face-tag tag-f" data-note="F">F</div>
<button class="click g" data-planet="G" aria-label="SOL gezegeni"></button><button class="click d" data-planet="D" aria-label="RE gezegeni"></button><button class="click a" data-planet="A" aria-label="LA gezegeni"></button><button class="click e" data-planet="E" aria-label="Mİ gezegeni"></button><button class="click b" data-planet="B" aria-label="Sİ gezegeni"></button>
</div><div class="status"><div id="message">Bir gezegen adına tıklayın.<span class="hint">Parlayan siyahları ve renkli kardeşleri izle.</span></div><button class="reset" id="reset">Sıfırla</button></div></div>
<script>
/*
==========================================================
  ME-005 — DİYEZ GEZEGENLERİ
  KOLAY EDİT BÖLÜMÜ

  Bir gezegenin davranışını değiştirmek için sadece
  PLANETS bölümünü düzenle.

  nums   = siyah yapı taşı numaraları
  active = uyanık ikizlerin isimleri
  label  = gezegen adı

  İkizler:
    SOL: E uyanık / F uyur
    RE, LA, Mİ, Sİ: E uyanık / F uyur
    B/C çifti de aynı mantıkla active listesine göre çalışır.
==========================================================
*/

const PLANETS = {
  G: { label: 'SOL', nums: [1],         active: ['B','E'] },
  D: { label: 'RE',  nums: [1,2],       active: ['B','E'] },
  A: { label: 'LA',  nums: [1,2,3],     active: ['B','E'] },
  E: { label: 'Mİ',  nums: [1,2,3,4],   active: ['B','E'] },
  B: { label: 'Sİ',  nums: [1,2,3,4,5], active: ['B','E'] }
};

/* ========================================================
   SİSTEM — NORMALDE BURAYI DEĞİŞTİRMENE GEREK YOK
======================================================== */

const svg = document.querySelector('.stage > svg');
const buttons = [...document.querySelectorAll('.click')];
const glows = [...document.querySelectorAll('.glow')];
const tags = [...document.querySelectorAll('.face-tag')];
const message = document.getElementById('message');

/*
  Çizimdeki iki gerçek ikiz konumu:
    sol çift  → E / F
    sağ çift  → B / C

  SVG'de hazır bulunan:
    g28    = sol uyanık
    g15    = sağ uyuyan
    g28-0  = sağ uyanık
    g15-7  = sağ uyuyan

  Sol taraftaki F için sağdaki uyuyan karakteri
  aynı görünümle sola kopyalıyoruz.
*/
const leftAwake  = svg.querySelector('#g28');
const rightAwake = svg.querySelector('#g28-0');
const rightSleep = svg.querySelector('#g15-7') || svg.querySelector('#g15');

let leftSleep = null;

if (rightSleep) {
  leftSleep = rightSleep.cloneNode(true);
  leftSleep.id = 'left-F-sleeper';
  leftSleep.setAttribute('transform', 'translate(245.43468,210)');
  leftSleep.style.display = 'none';
  rightSleep.parentNode.insertBefore(leftSleep, rightSleep);
}

function resetTwins() {
  if (leftAwake)  leftAwake.style.display = 'inline';
  if (rightAwake) rightAwake.style.display = 'inline';
  if (rightSleep) rightSleep.style.display = 'inline';
  if (leftSleep)  leftSleep.style.display = 'none';

  document.querySelectorAll('.wake-pop')
    .forEach(x => x.classList.remove('wake-pop'));
}

function clearAll() {
  buttons.forEach(x => x.classList.remove('active'));
  glows.forEach(x => x.classList.remove('on'));
  tags.forEach(x => x.classList.remove('active'));
  resetTwins();
}

function animateAwake(el, delay = 0) {
  if (!el) return;

  setTimeout(() => {
    el.classList.remove('wake-pop');
    void el.getBBox();
    el.classList.add('wake-pop');
  }, delay);
}

function setTwinState(active) {
  const E = active.includes('E');
  const F = active.includes('F');
  const B = active.includes('B');
  const C = active.includes('C');

  /*
    SOL ÇİFTİ: E / F
  */
  if (leftAwake) leftAwake.style.display = E ? 'inline' : 'none';
  if (leftSleep) leftSleep.style.display = F ? 'inline' : 'none';

  /*
    SAĞ ÇİFTİ: B / C
  */
  if (rightAwake) rightAwake.style.display = B ? 'inline' : 'none';
  if (rightSleep) rightSleep.style.display = C ? 'inline' : 'none';

  /*
    Uyanan çocukların küçük animasyonu
  */
  const map = { E: leftAwake, F: leftSleep, B: rightAwake, C: rightSleep };

  active.forEach((note, i) => {
    animateAwake(map[note], i * 100);
  });
}

function selectPlanet(key, button) {
  clearAll();

  const planet = PLANETS[key];
  if (!planet) return;

  button.classList.add('active');

  planet.nums.forEach((num, i) => {
    setTimeout(() => {
      const glow = document.querySelector(`[data-num="${num}"]`);
      if (glow) glow.classList.add('on');
    }, i * 170);
  });

  const delay = planet.nums.length * 170 + 80;

  planet.active.forEach((note, i) => {
    setTimeout(() => {
      const tag = document.querySelector(`[data-note="${note}"]`);
      if (tag) tag.classList.add('active');
    }, delay + i * 90);
  });

  setTimeout(() => setTwinState(planet.active), delay);

  message.innerHTML =
    `<span>${planet.label}</span>` +
    `<span class="hint">Siyah yapı taşları: ${planet.nums.join('–')} · Renkli kardeşler basılır.</span>`;
}

buttons.forEach(button => {
  button.addEventListener('click', () =>
    selectPlanet(button.dataset.planet, button)
  );
});

document.getElementById('reset').addEventListener('click', () => {
  clearAll();
  message.innerHTML =
    'Bir gezegen adına tıklayın.' +
    '<span class="hint">Parlayan siyahları ve renkli kardeşleri izle.</span>';
});
</script></body></html>
