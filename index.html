<title>Müzik Evreni — Gezegen Tespit Sistemleri</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1f3a; color:white;
  }
  main{width:min(92vw,760px); text-align:center}
  h1{font-size:clamp(30px,6vw,54px); margin:0 0 12px}
  p{font-size:clamp(16px,2.5vw,21px); opacity:.86; margin:0 0 34px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  a{
    display:block; padding:30px 18px; border:3px solid #f2c463;
    border-radius:22px; color:white; text-decoration:none;
    background:#123766; font-size:clamp(22px,4vw,34px); font-weight:700;
    transition:.2s transform,.2s background;
  }
  a:hover{transform:translateY(-4px);background:#184879}
  small{display:block;margin-top:9px;font-size:15px;font-weight:400;opacity:.78}
  @media(max-width:580px){.grid{grid-template-columns:1fr}}
</style>
</head>

  <h1>Gezegen Tespit Sistemleri</h1>
